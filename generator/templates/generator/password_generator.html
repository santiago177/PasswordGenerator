<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .banner {
            background: linear-gradient(90deg, orange 0%, #fff3e0 100%);
            color: #fff;
            padding: 2rem 0 1.5rem 0;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            border-radius: 0 0 1rem 1rem;
            box-shadow: 0 2px 8px rgba(255, 165, 0, 0.1);
        }
        .password-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 2rem;
            word-break: break-all;
        }
        .centered-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .big-input {
            font-size: 2rem;
            height: 3.5rem;
            width: 8rem;
            text-align: center;
        }
        .big-btn {
            font-size: 2rem;
            height: 3.5rem;
            margin-left: 1rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="banner">Password Generator</div>
    <div class="container">
        <form id="generator-form" class="centered-form mb-4" onsubmit="return false;">
            <div class="d-flex justify-content-center align-items-center mb-3">
                <input type="number" min="1" max="128" value="12" id="length" class="form-control big-input me-3" style="max-width: 8rem;" required>
                <button id="generate-btn" class="btn btn-warning big-btn" type="submit">Generate Password</button>
            </div>
        </form>
        <div id="password-result" class="password-display text-center"></div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('generator-form').addEventListener('submit', async function() {
            const length = document.getElementById('length').value;
            const resultDiv = document.getElementById('password-result');
            resultDiv.textContent = '';
            try {
                const response = await fetch(`/generate-password/?length=${length}`);
                const data = await response.json();
                if (data.password) {
                    resultDiv.textContent = data.password;
                    resultDiv.classList.remove('text-danger');
                } else if (data.error) {
                    resultDiv.textContent = data.error;
                    resultDiv.classList.add('text-danger');
                }
            } catch (e) {
                resultDiv.textContent = 'Error generating password.';
                resultDiv.classList.add('text-danger');
            }
        });
    </script>
</body>
</html>
